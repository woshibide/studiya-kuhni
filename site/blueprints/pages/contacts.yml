title: Контакты
extends: page-options/singleton
tabs:
  contacts:
    label: Контакты
    icon: phone
    sections:
      usage:
        type: info
        label: 'Общие контакты'
        text: 'Телефон, адрес, ссылки и форма используются на странице контактов и в панели связи на всём сайте.'
      details:
        type: fields
        fields:
          details_heading_ui:
            type: headline
            label: 'Как связаться'
          phone:
            label: Телефон
            type: tel
            placeholder: '+7 968 263-82-70'
            default: '+7 968 263-82-70'
          messengers:
            label: Мессенджеры
            type: structure
            fields:
              title:
                label: Название
                type: text
                required: true
              url:
                label: Ссылка
                type: url
                required: true
            columns:
              title:
                label: Название
                width: 1/3
              url:
                label: Ссылка
                width: 2/3
          email:
            label: 'Электронная почта'
            type: email
            placeholder: Info@petru-grupp.ru
      address:
        type: fields
        fields:
          address_heading_ui:
            type: headline
            label: 'Студия и адрес'
          studio_name:
            label: 'Название студии'
            type: text
            default: 'Студия Кухни'
            placeholder: 'Студия Кухни'
          address:
            label: Адрес
            type: textarea
            buttons: false
          hours:
            label: 'График работы'
            type: text
            default: 'Ежедневно с 10:00 до 22:00'
            placeholder: 'Ежедневно с 10:00 до 22:00'
          map_links:
            label: 'Ссылки на карты'
            type: structure
            fields:
              title:
                label: Название
                type: text
                required: true
              url:
                label: Ссылка
                type: url
                required: true
            columns:
              title:
                label: Название
                width: 1/3
              url:
                label: Ссылка
                width: 2/3
  form:
    label: 'Форма заявки'
    icon: email
    sections:
      form_fields:
        type: fields
        fields:
          form_heading_ui:
            type: headline
            label: 'Текст формы'
          callback_title:
            label: 'Заголовок формы обратной связи'
            type: text
            default: 'Форма обратной связи'
            placeholder: 'Форма обратной связи'
          consent_text:
            label: 'Текст согласия'
            type: textarea
            buttons: false
            default: 'С порядком обработки данных ознакомился и даю согласие на обратную связь'
            placeholder: 'С порядком обработки данных ознакомился и даю согласие на обратную связь'
          callback_button_text:
            label: 'Текст кнопки формы'
            type: text
            default: 'Перезвоните мне'
            placeholder: 'Перезвоните мне'
      hints:
        type: fields
        fields:
          hints_heading_ui:
            type: headline
            label: 'Подсказки в полях'
          callback_phone_placeholder:
            label: 'Подсказка в поле телефона'
            type: text
            default: 'Ваш номер телефона?'
            placeholder: 'Ваш номер телефона?'
          callback_name_placeholder:
            label: 'Подсказка в поле имени'
            type: text
            default: 'Как к Вам обращаться?'
            placeholder: 'Как к Вам обращаться?'
          callback_email_placeholder:
            label: 'Подсказка в поле электронной почты'
            type: text
            default: 'Электронная почта? (Опционально)'
            placeholder: 'Электронная почта? (Опционально)'
  content:
    label: 'Заголовки страницы'
    icon: text
    sections:
      titles:
        type: fields
        fields:
          titles_heading_ui:
            type: headline
            label: 'Страница и панель связи'
          panel_title:
            label: 'Заголовок панели контактов'
            type: text
            default: Контакты
            placeholder: Контакты
          help_title:
            label: 'Заголовок блока контактов'
            type: text
            default: Контакты
            placeholder: Контакты
          intro_text:
            extends: fields/rich-text-inline
            label: 'Вступительный текст'
            size: medium
            default: 'Выберите удобный способ связи и оставьте заявку, если хотите обратный звонок.'
            placeholder: 'Выберите удобный способ связи и оставьте заявку, если хотите обратный звонок.'
          address_section_title:
            label: 'Заголовок блока адреса'
            type: text
            default: 'Адрес и карты'
            placeholder: 'Адрес и карты'
  files: tabs/files
  seo: tabs/seo
