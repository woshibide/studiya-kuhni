title: Воспоминания
extends: page-options/singleton
tabs:
  posts:
    label: Публикации
    icon: book
    sections:
      archive_note:
        type: info
        label: 'Архив пока закрыт'
        text: 'Раздел закрыт для посетителей независимо от статуса страниц. Материалы можно редактировать здесь; на сайте архив пока недоступен.'
      posts:
        type: pages
        templates:
          - archive-post
        layout: cards
        status: all
        sortBy: 'date desc'
        image:
          query: page.cover.toFile
          ratio: 4/3
          cover: true
        label: Публикации
        info: '{{ page.date.toDate("d.m.Y") }}'
        size: small
  content:
    label: Страница
    icon: text
    sections:
      fields:
        type: fields
        fields:
          archive_heading_ui:
            type: headline
            label: Название
          title:
            label: 'Название страницы'
            type: text
  files: tabs/files
  seo: tabs/seo
