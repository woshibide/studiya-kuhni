title: 'Публикация в архиве'
extends: page-options/standard
tabs:
  content:
    label: Публикация
    icon: text
    columns:
      -
        width: 2/3
        sections:
          article:
            type: fields
            fields:
              article_heading_ui:
                type: headline
                label: 'Название и содержание'
              title:
                type: text
                label: 'Название публикации'
              intro:
                extends: fields/rich-text-inline
                label: 'Краткое описание'
                maxlength: 220
                counter: true
                size: small
              blocks:
                extends: fields/article-blocks
      -
        width: 1/3
        sections:
          cover:
            type: fields
            fields:
              cover_heading_ui:
                type: headline
                label: Обложка
              cover:
                label: Обложка
                type: files
                max: 1
                layout: cards
                query: page.images
                uploads:
                  template: image
          details:
            type: fields
            fields:
              details_heading_ui:
                type: headline
                label: 'Сведения о проекте'
              date:
                label: Дата
                type: date
                default: today
              is_new:
                label: 'Новая публикация'
                type: toggle
                default: false
                text:
                  - нет
                  - да
              location:
                label: 'Город или район'
                type: text
                placeholder: Москва
                help: 'Укажите город или район, где находится кухня'
              collaborator:
                label: 'Участник проекта'
                type: text
                default: '@valeriya_dimova'
                placeholder: '@valeriya_dimova'
              collaborator_link:
                label: 'Ссылка на участника'
                type: url
                default: 'https://instagram.com/valeriya_dimova'
              showcase_kitchen:
                label: 'Кухня в проекте'
                type: pages
                max: 1
                query: 'site.index(true).filterBy("intendedTemplate", "kuhnya")'
                subpages: false
                text: '{{ page.parent.title }} - {{ page.title }}'
                help: 'Выберите кухню, о которой рассказывает пост. Перед публикацией поста опубликуйте выбранную кухню и её фабрику.'
                required: true
                image:
                  query: page.studioKitchenImages.first
                  ratio: 4/3
                  cover: true
          archive_note:
            type: info
            label: 'Архив пока закрыт'
            text: 'Статус публикации не открывает весь архив посетителям. Раздел включается отдельно при подготовке к запуску.'
  files: tabs/files
  seo: tabs/seo
