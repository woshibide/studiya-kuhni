title: Дизайнерам
extends: page-options/singleton
tabs:
  content:
    label: Страница
    icon: text
    sections:
      hero:
        type: fields
        fields:
          hero_heading_ui:
            type: headline
            label: 'Первый экран'
          title:
            type: text
            label: 'Название страницы'
          simple_hero_heading:
            label: 'Заголовок первого экрана'
            type: text
            help: 'Если поле пустое, используется название страницы.'
          simple_hero_description:
            extends: fields/rich-text-inline
            label: 'Описание первого экрана'
            size: small
          simple_hero_button_label:
            label: 'Текст кнопки связи'
            type: text
            placeholder: Давайте)
            help: 'Открывает общую форму связи. Оставьте пустым, чтобы убрать кнопку.'
      about:
        type: fields
        fields:
          about_heading_ui:
            type: headline
            label: 'О студии'
          designers_about_text:
            extends: fields/rich-text
            label: 'Рассказ о студии'
            help: 'Текст после первого экрана, перед лентой брендов. Пока поле пустое, показан только заголовок.'
      brands:
        type: fields
        fields:
          brands_heading_ui:
            type: headline
            label: 'Фабрики и бренды'
          brands_heading:
            label: 'Заголовок блока брендов'
            type: text
            placeholder: 'Мы привозим на КМВ'
            help: 'Если поле пустое, используется заголовок, показанный в подсказке.'
          brands_intro_text:
            extends: fields/rich-text-inline
            label: 'Описание блока брендов'
            help: 'Если поле пустое, используется текущий текст блока. Общая лента логотипов редактируется на главной странице, во вкладке «Блоки страницы».'
      message:
        type: fields
        fields:
          message_heading_ui:
            type: headline
            label: 'Крупная фраза'
          big_message:
            label: 'Крупная фраза'
            type: text
            default: 'Кухни. Созданные для вашей жизни'
            placeholder: 'Кухни. Созданные для вашей жизни'
      benefits:
        type: fields
        fields:
          benefits_heading_ui:
            type: headline
            label: Преимущества
          benefits_heading:
            label: 'Заголовок преимуществ'
            type: text
            default: Преимущества
            placeholder: Преимущества
          benefits_items:
            extends: fields/benefits
  designers:
    label: Дизайнеры
    icon: users
    sections:
      proof:
        type: fields
        fields:
          proof_heading_ui:
            type: headline
            label: 'С нами работают'
          designers_proof_heading:
            label: 'Заголовок блока дизайнеров'
            type: text
            default: 'С нами работают'
            placeholder: 'С нами работают'
          designers_proof_lead:
            extends: fields/rich-text-inline
            label: 'Описание сотрудничества'
          designers_cards:
            label: Дизайнеры
            type: structure
            columns:
              name:
                label: Имя
                width: 1/2
              years:
                label: 'Лет вместе'
                width: 1/4
              projects:
                label: Проектов
                width: 1/4
            fields:
              name:
                label: Имя
                type: text
                required: true
              image:
                label: Фото
                type: files
                max: 1
                layout: cards
                query: page.images
                uploads:
                  template: image
              years:
                label: 'Сотрудничаем лет'
                type: number
                min: 0
                step: 1
                required: true
              portfolio_url:
                label: 'Ссылка на портфолио'
                type: url
              projects:
                label: 'Сделали проектов'
                type: number
                min: 0
                step: 1
                required: true
              description:
                extends: fields/rich-text-inline
                label: 'Описание сотрудничества'
                size: small
                default: 'Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus.'
      work:
        type: fields
        fields:
          work_heading_ui:
            type: headline
            label: 'Формат работы'
          designers_work_heading:
            label: 'Заголовок формата работы'
            type: text
            placeholder: 'Как мы работаем'
            help: 'Если поле пустое, используется заголовок, показанный в подсказке.'
          designers_work_text:
            extends: fields/rich-text
            label: 'Описание формата работы'
            help: 'Вступление к этапам сотрудничества после карточек дизайнеров.'
          designers_work_button:
            label: 'Текст кнопки связи'
            type: text
            placeholder: 'Обсудить сотрудничество'
            help: 'Открывает общую форму связи.'
          designers_work_steps:
            label: 'Этапы сотрудничества'
            type: structure
            help: 'Порядок этапов на странице совпадает с порядком в списке.'
            columns:
              heading:
                label: Этап
            fields:
              heading:
                label: 'Название этапа'
                type: text
                required: true
              text:
                extends: fields/rich-text
                label: 'Описание этапа'
                size: medium
  files: tabs/files
  seo: tabs/seo
