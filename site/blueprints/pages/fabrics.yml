title: Фабрики
extends: page-options/singleton
tabs:
  catalogue:
    label: Фабрики
    icon: grid
    sections:
      brands:
        type: pages
        templates:
          - fabric
        layout: cards
        status: all
        image:
          query: page.fabric_logo.toFile
          ratio: 3/2
          cover: false
          back: white
        label: Фабрики
        size: small
        info: 'Кухни: {{ page.childrenAndDrafts.count }}'
        help: 'Откройте фабрику, чтобы изменить её описание, карту или кухни. Перетаскиванием меняется порядок фабрик со статусом «Опубликована с сортировкой».'
  content:
    label: 'Страница каталога'
    icon: text
    sections:
      hero:
        type: fields
        fields:
          hero_heading_ui:
            type: headline
            label: 'Первый экран'
          title:
            label: 'Название страницы'
            type: text
          simple_hero_heading:
            label: 'Заголовок первого экрана'
            type: text
            help: 'Если поле пустое, используется название страницы.'
          simple_hero_description:
            extends: fields/rich-text-inline
            label: 'Описание первого экрана'
            size: small
          simple_hero_button_label:
            label: 'Текст кнопки связи'
            type: text
            placeholder: Давайте)
            help: 'Открывает общую форму связи. Оставьте пустым, чтобы убрать кнопку.'
      benefits:
        type: fields
        fields:
          benefits_heading_ui:
            type: headline
            label: Преимущества
          benefits_heading:
            label: 'Заголовок преимуществ'
            type: text
            default: Преимущества
            placeholder: Преимущества
          benefits_items:
            extends: fields/benefits
      message:
        type: fields
        fields:
          message_heading_ui:
            type: headline
            label: 'Крупная фраза'
          big_message:
            label: 'Крупная фраза'
            type: text
            placeholder: 'Кухни. Созданные для вашей жизни'
            help: 'Если поле пустое, используется фраза, показанная в подсказке.'
      cta:
        type: fields
        fields:
          cta_heading_ui:
            type: headline
            label: Заявка
          cta_heading:
            label: 'Заголовок блока заявки'
            type: text
            default: 'Отпразднуем вашу новую кухню?'
            placeholder: 'Отпразднуем вашу новую кухню?'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_text:
            extends: fields/rich-text-inline
            label: 'Текст блока заявки'
            size: small
            default: 'Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus duis convallis tempus leo eu aenean sed diam.'
            placeholder: 'Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus duis convallis tempus leo eu aenean sed diam.'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_button:
            label: 'Текст кнопки заявки'
            type: text
            default: 'Свяжитесь со мной'
            placeholder: 'Свяжитесь со мной'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_image:
            label: 'Изображение блока заявки'
            type: files
            multiple: false
            max: 1
            layout: cards
            query: page.images
            uploads:
              template: image
      warmup:
        type: fields
        fields:
          warmup_heading_ui:
            type: headline
            label: Консультация
          consultation:
            extends: fields/consultation
  library: tabs/section-library
  files: tabs/files
  seo: tabs/seo
