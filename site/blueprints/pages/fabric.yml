title: Фабрика
extends: page-options/standard
image:
  query: page.fabric_logo.toFile
  ratio: 3/2
  cover: false
  back: white
tabs:
  collections:
    label: Кухни
    icon: grid
    sections:
      pages:
        type: pages
        templates:
          - kuhnya
        layout: cards
        status: all
        image:
          query: page.studioKitchenImages.first
          ratio: 4/3
          cover: true
        label: 'Кухни фабрики'
        size: small
        info: '{{ page.country_of_origin }}'
        help: 'Создайте кухню как черновик, заполните карточку и фотографии, затем измените статус для публикации.'
  card:
    label: 'О фабрике'
    icon: text
    columns:
      -
        width: 2/3
        sections:
          hero:
            type: fields
            fields:
              hero_heading_ui:
                type: headline
                label: 'Первый экран'
              title:
                label: 'Название фабрики'
                type: text
              simple_hero_heading:
                label: 'Заголовок первого экрана'
                type: text
                help: 'Если поле пустое, используется название страницы.'
              simple_hero_description:
                extends: fields/rich-text-inline
                label: 'Описание первого экрана'
                size: small
              simple_hero_button_label:
                label: 'Текст кнопки связи'
                type: text
                placeholder: Давайте)
                help: 'Открывает общую форму связи. Оставьте пустым, чтобы убрать кнопку.'
          about:
            type: fields
            fields:
              about_heading_ui:
                type: headline
                label: 'О фабрике'
              fabric_info_title:
                label: 'Заголовок рассказа о фабрике'
                type: text
                default: 'О фабрике'
                placeholder: 'О фабрике'
              fabric_info_text:
                extends: fields/rich-text
                label: 'Рассказ о фабрике'
                size: medium
                help: 'Показывается на странице фабрики и на страницах всех её кухонь.'
          message:
            type: fields
            fields:
              message_heading_ui:
                type: headline
                label: 'Крупная фраза'
              big_message:
                label: 'Фраза перед кухнями фабрики'
                type: text
                placeholder: 'Кухни. Созданные для вашей жизни'
                help: 'Если поле пустое, используется фраза, показанная в подсказке.'
      -
        width: 1/3
        sections:
          brand:
            type: fields
            fields:
              brand_heading_ui:
                type: headline
                label: Логотип
              fabric_logo:
                label: Логотип
                type: files
                multiple: false
                max: 1
                layout: cards
                size: tiny
                image:
                  back: white
                  cover: false
                query: 'page.images.template("fabric-logo")'
                uploads:
                  template: fabric-logo
                help: 'Загрузите логотип в формате SVG или PNG.'
          sharing:
            type: info
            label: 'Общие данные'
            text: 'Рассказ, логотип и карта фабрики автоматически используются на страницах её кухонь.'
  location:
    label: Карта
    icon: map
    columns:
      -
        width: 2/3
        sections:
          location:
            type: fields
            fields:
              location_heading_ui:
                type: headline
                label: Местоположение
              fabric_location:
                label: 'Местоположение фабрики'
                type: locator
                tiles: openstreetmap
                geocoding: nominatim
                autocomplete: false
                language: ru
                saveZoom: true
                autoSaveZoom: true
                draggable: true
                collapse: false
                dblclick: marker
                center:
                  lat: 0
                  lon: 0
                zoom:
                  min: 2
                  default: 3
                  max: 19
                display:
                  - lat
                  - lon
                  - address
                  - city
                  - country
                help: 'Найдите адрес или введите координаты «широта, долгота». Точку можно переместить на карте. Сохраните страницу, чтобы обновить карту фабрики и её кухонь. Удаление точки скрывает карту.'
      -
        width: 1/3
        sections:
          map_label:
            type: fields
            fields:
              map_label_heading_ui:
                type: headline
                label: Подпись
              fabric_map_label:
                label: 'Название точки на карте'
                type: text
                placeholder: 'Название фабрики'
                help: 'Если поле пустое, используется название фабрики.'
          map_help:
            type: info
            label: 'Сохранение точки'
            text: 'Укажите адрес или координаты, уточните положение маркера и сохраните страницу. Удаление точки скрывает карту фабрики и её кухонь.'
  files: tabs/files
  seo: tabs/seo
