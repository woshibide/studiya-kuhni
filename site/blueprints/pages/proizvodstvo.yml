title: Производство
extends: page-options/singleton
tabs:
  content:
    label: Страница
    icon: text
    sections:
      hero:
        type: fields
        fields:
          hero_heading_ui:
            type: headline
            label: 'Первый экран'
          title:
            label: 'Название страницы'
            type: text
          simple_hero_heading:
            label: 'Заголовок первого экрана'
            type: text
            help: 'Если поле пустое, используется название страницы.'
          simple_hero_description:
            extends: fields/rich-text-inline
            label: 'Описание первого экрана'
            size: small
          simple_hero_button_label:
            label: 'Текст кнопки связи'
            type: text
            placeholder: Давайте)
            help: 'Открывает общую форму связи. Оставьте пустым, чтобы убрать кнопку.'
      image:
        type: fields
        fields:
          image_heading_ui:
            type: headline
            label: 'Основное изображение'
          single_image:
            label: 'Основное изображение'
            type: files
            max: 1
            layout: cards
            query: page.images
            uploads:
              template: image
          single_image_alt:
            label: 'Описание изображения'
            type: text
            width: 1/2
            help: 'Для незрячих пользователей. Если поле пустое, используется описание из карточки файла.'
      benefits:
        type: fields
        fields:
          benefits_heading_ui:
            type: headline
            label: Преимущества
          benefits_heading:
            label: 'Заголовок преимуществ'
            type: text
            default: Преимущества
            placeholder: Преимущества
          benefits_items:
            extends: fields/benefits
      message:
        type: fields
        fields:
          message_heading_ui:
            type: headline
            label: 'Крупная фраза'
          big_message:
            label: 'Крупная фраза'
            type: text
      warmup:
        type: fields
        fields:
          warmup_heading_ui:
            type: headline
            label: Консультация
          consultation:
            extends: fields/consultation
  files: tabs/files
  seo: tabs/seo
