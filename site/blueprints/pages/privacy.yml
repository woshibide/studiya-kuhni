title: Конфиденциальность
extends: page-options/singleton
tabs:
  content:
    label: Страница
    icon: text
    sections:
      hero:
        type: fields
        fields:
          hero_heading_ui:
            type: headline
            label: 'Первый экран'
          title:
            label: 'Название страницы'
            type: text
          simple_hero_heading:
            label: 'Заголовок первого экрана'
            type: text
            help: 'Если поле пустое, используется название страницы.'
          simple_hero_description:
            extends: fields/rich-text-inline
            label: 'Описание первого экрана'
            size: small
          simple_hero_button_label:
            label: 'Текст кнопки связи'
            type: text
            placeholder: Давайте)
            help: 'Открывает общую форму связи. Оставьте пустым, чтобы убрать кнопку.'
      text:
        type: fields
        fields:
          text_heading_ui:
            type: headline
            label: 'Текст страницы'
          text:
            extends: fields/rich-text
            label: 'Текст политики конфиденциальности'
            size: large
  files: tabs/files
  seo: tabs/seo
