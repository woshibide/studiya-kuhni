title: Кухня
extends: page-options/standard
tabs:
  card:
    label: 'Карточка и фото'
    icon: image
    columns:
      -
        width: 2/3
        sections:
          main:
            type: fields
            fields:
              main_heading_ui:
                type: headline
                label: 'Название и описание'
              title:
                type: text
                label: 'Название кухни'
              intro:
                extends: fields/rich-text-inline
                label: 'Краткое описание'
                size: small
                maxlength: 300
                placeholder: 'Краткое описание кухни до 300 символов'
                default: 'Сдержанная кухня с продуманной эргономикой, аккуратными линиями и практичными материалами для комфортной жизни.'
          photos:
            type: fields
            fields:
              photos_heading_ui:
                type: headline
                label: Фотографии
              kitchen_gallery_images:
                label: 'Фотографии кухни'
                type: files
                multiple: true
                layout: cards
                query: 'page.images.filterBy("extension", "!=", "svg")'
                uploads:
                  template: image
                help: 'Первое выбранное фото становится обложкой карточки. Перетаскивайте фотографии, чтобы менять порядок на первом экране и в галереях. Если ничего не выбрано, используются изображения из файлов страницы.'
                size: small
                image:
                  ratio: 4/3
                  cover: true
      -
        width: 1/3
        sections:
          facts:
            type: fields
            fields:
              facts_heading_ui:
                type: headline
                label: 'Краткие сведения'
              country_of_origin:
                label: 'Место производства'
                type: text
                placeholder: Италия
                default: Италия
              price:
                label: Цена
                type: text
                placeholder: 'От 0,000,000 рублей'
                default: 'от 0,000,000 рублей'
              kitchen_specs:
                label: Характеристики
                type: structure
                help: 'Добавляйте дополнительные характеристики для карточки кухни'
                columns:
                  label:
                    width: 1/3
                  value:
                    width: 2/3
                fields:
                  label:
                    label: Характеристика
                    type: text
                    required: true
                  value:
                    label: Значение
                    type: text
          parent_info:
            type: info
            label: 'О фабрике'
            text: 'Логотип, описание и карта берутся из родительской фабрики. Для их изменения откройте фабрику в навигации страницы.'
  page:
    label: 'Блоки страницы'
    icon: text
    sections:
      features:
        type: fields
        fields:
          features_heading_ui:
            type: headline
            label: Детали
          kitchen_features:
            extends: fields/section-selection
            label: 'Детали кухни'
      benefits:
        type: fields
        fields:
          benefits_heading_ui:
            type: headline
            label: Преимущества
          benefits_heading:
            label: 'Заголовок преимуществ'
            type: text
            default: Преимущества
            placeholder: Преимущества
          benefits_items:
            extends: fields/benefits
      cta:
        type: fields
        fields:
          cta_heading_ui:
            type: headline
            label: Заявка
          cta_heading:
            label: 'Заголовок блока заявки'
            type: text
            default: 'Отпразднуем вашу новую кухню?'
            placeholder: 'Отпразднуем вашу новую кухню?'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_text:
            extends: fields/rich-text-inline
            label: 'Текст блока заявки'
            size: small
            default: 'Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus duis convallis tempus leo eu aenean sed diam.'
            placeholder: 'Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus ex sapien vitae pellentesque sem placerat in id cursus mi pretium tellus duis convallis tempus leo eu aenean sed diam.'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_button:
            label: 'Текст кнопки заявки'
            type: text
            default: 'Свяжитесь со мной'
            placeholder: 'Свяжитесь со мной'
            help: 'Если поле пустое, используется текст по умолчанию.'
          cta_image:
            label: 'Изображение блока заявки'
            type: files
            multiple: false
            max: 1
            layout: cards
            query: page.images
            uploads:
              template: image
  files: tabs/files
  seo: tabs/seo
