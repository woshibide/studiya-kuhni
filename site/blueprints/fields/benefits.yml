type: structure
label: Карточки преимуществ
max: 5
duplicate: false
empty: Добавьте преимущество из библиотеки
validate:
  sectionReferences: true
columns:
  reference:
    width: 1/3
    mobile: true
  text:
    width: 2/3
help: 'До пяти карточек. Порядок меняется перетаскиванием. Карточки без текста скрыты. (link: /panel/pages/fabrics?tab=library text: Открыть библиотеку target: _blank)'
fields:
  reference:
    label: Преимущество
    type: select
    required: true
    placeholder: Выберите из библиотеки
    options:
      type: query
      query: page.studioBenefitOptions
      text: '{{ item.text }}'
      value: '{{ item.value }}'
      info: '{{ item.info }}'
    help: Название и иконка общие для всех страниц, где выбрано это преимущество.
  text:
    extends: fields/rich-text-inline
    label: Текст для этой страницы
    placeholder: Чем это преимущество полезно здесь…
    help: Оставьте пустым, чтобы скрыть карточку на этой странице.
    maxlength: 180
    counter: true
    size: small
