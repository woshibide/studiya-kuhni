[kuhni-design]
user = kuhni-design
group = kuhni-design
listen = /run/php/php8.5-fpm-kuhni-design.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
pm.max_requests = 300
request_terminate_timeout = 120s
clear_env = yes
env[STUDIO_ENV] = staging
env[STUDIO_PRODUCTION_URL] = https://studiya-kuhni-kmv.ru
env[STUDIO_SHARED_ROOT] = /srv/kuhni/design/shared
env[STUDIO_CALLBACK_ENABLED] = 0
env[MAGICK_MEMORY_LIMIT] = 128MiB
env[MAGICK_MAP_LIMIT] = 128MiB
env[MAGICK_THREAD_LIMIT] = 1
security.limit_extensions = .php
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 90
php_admin_value[upload_tmp_dir] = /srv/kuhni/design/shared/tmp
php_admin_value[sys_temp_dir] = /srv/kuhni/design/shared/tmp
php_admin_value[session.save_path] = /srv/kuhni/design/shared/sessions
php_admin_value[error_log] = /srv/kuhni/design/shared/logs/php-error.log
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[expose_php] = Off
php_admin_value[cgi.fix_pathinfo] = 0
