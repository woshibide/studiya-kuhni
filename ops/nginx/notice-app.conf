index index.html;
autoindex off;
add_header X-Content-Type-Options nosniff always;
location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }
location ~ /\. { return 404; }
location ~* \.(?:php[0-9]?|phtml|phar)(?:/|$) { return 404; }
location / { try_files $uri $uri/ =404; }
