# Loopback-only deployment health checks work before DNS and certificates exist.
server {
    listen 127.0.0.1:8087;
    server_name design.studiya-kuhni-kmv.ru;
    root /srv/kuhni/design/current;
    include /etc/nginx/snippets/kuhni-design-app.conf;
}
server {
    listen 127.0.0.1:8087;
    server_name studiya-kuhni-kmv.ru;
    root /srv/kuhni/notice/current;
    include /etc/nginx/snippets/kuhni-notice-app.conf;
}
