# Strip only the temporary setup login; Kirby uses its own session afterwards.
map $http_authorization $kuhni_app_authorization {
    default $http_authorization;
    "~^Basic +c2V0dXA6" "";
}

# Match the raw Kirby route before Nginx normalizes encoded slashes and dots.
# Kirby discards colon-parameter segments, including those before panel/api.
map $request_uri $kuhni_setup_request_realm {
    default off;
    "~^/+(?:[^/?]*:[^/?]*/+)*(?:panel|api)(?:/|\?|$)" "Kirby setup";
}
