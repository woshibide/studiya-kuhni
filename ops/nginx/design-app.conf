index index.php;
autoindex off;
client_max_body_size 20m;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cache-Control "no-store" always;
set $kuhni_setup_realm off;
if (-f /srv/kuhni/design/shared/setup/enabled) { set $kuhni_setup_realm $kuhni_setup_request_realm; }
auth_basic $kuhni_setup_realm;
auth_basic_user_file /etc/nginx/kuhni-setup.htpasswd;

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /\n";
}
location = /sitemap.xml { return 404; }
location ~* ^/(?:site|kirby|vendor|content|tests|tools|docs|ops|static|storage|backups)(?:/|$) { return 404; }
location ~ /\. { return 404; }
location ~* ^/(?:bootstrap\.php|composer\.(?:json|lock)|package(?:-lock)?\.json|README\.md|foo\.md|skills-lock\.json)$ { return 404; }
location ~* \.(?:php[0-9]?|phtml|phar)(?:/|$) { return 404; }
location / { try_files $uri $uri/ /index.php?$query_string; }
location /assets/ { try_files $uri =404; }
location /media/ { try_files $uri /index.php?$query_string; }
location = /index.php {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PORT 443;
    fastcgi_param HTTP_AUTHORIZATION $kuhni_app_authorization;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTP_FORWARDED "";
    fastcgi_param HTTP_X_FORWARDED_FOR "";
    fastcgi_param HTTP_X_FORWARDED_HOST "";
    fastcgi_param HTTP_X_FORWARDED_PROTO "";
    fastcgi_param HTTP_X_REAL_IP "";
    fastcgi_pass unix:/run/php/php8.5-fpm-kuhni-design.sock;
    fastcgi_hide_header X-Robots-Tag;
    fastcgi_read_timeout 120s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 32k;
}
